[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyDefender"
version = "0.1.0"
description = "Python source-code obfuscator and protection tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zirox" },
]
requires-python = ">=3.9"
keywords = [
    "python",
    "obfuscator",
    "obfuscation",
    "source-code",
    "protection",
    "code-protection",
    "security",
    "cli",
    "pydefender",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ziroxisnothere/PyDefender"
Repository = "https://github.com/ziroxisnothere/PyDefender"
Issues = "https://github.com/ziroxisnothere/PyDefender/issues"
Changelog = "https://github.com/ziroxisnothere/PyDefender/releases"

[project.scripts]
pydefender = "pydefender:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pydefender*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
pydefender = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
